# Refreshes server/public/ipos.json on a schedule, entirely on GitHub's free tier.
# The Android app reads that file over raw.githubusercontent.com.

name: Build IPO feed

on:
  schedule:
    # Every 2 hours between ~6am and ~10pm IST (cron is UTC).
    - cron: '30 0-16/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Build feed
        working-directory: server
        run: node scrape.mjs

      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add server/public/ipos.json
          git diff --staged --quiet || git commit -m "chore: refresh IPO feed"
          git push
